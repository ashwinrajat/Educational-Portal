
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win's LearnHub - Staff Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background: linear-gradient(135deg, #0f172a, #164e63, #312e81);
        }

        .register-card {
            width: 100%;
            max-width: 480px;
            padding: 35px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 8px;
        }

        h2 {
            text-align: center;
            color: #172554;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            color: #334155;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            border: none;
            border-radius: 9px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .bottom-link {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        .error {
            color: #dc2626;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="register-card">

    <div class="logo">🎓 Win's LearnHub</div>

    <h2>Staff Registration</h2>
    <p class="subtitle">Create your staff account</p>

    <form action="RegisterStaffServlet" method="post"
          onsubmit="return validateForm()">

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your full name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone"
               placeholder="10-digit phone number"
               pattern="[0-9]{10}" maxlength="10" required>

        <label for="department">Department</label>
        <input type="text" id="department" name="department"
               placeholder="Enter your department" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Create a password" required>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword"
               name="confirmPassword"
               placeholder="Re-enter your password" required>

        <p id="errorMessage" class="error"></p>

        <button type="submit">Create Staff Account</button>

    </form>

    <div class="bottom-link">
        Already registered?
        <a href="login.jsp">Login here</a>
    </div>

</div>

<script>
    function validateForm() {
        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;
        const error = document.getElementById("errorMessage");

        if (password !== confirmPassword) {
            error.textContent = "Passwords do not match.";
            return false;
        }

        error.textContent = "";
        return true;
    }
</script>

</body>
</html>
