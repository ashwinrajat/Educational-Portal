<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Win's LearnHub | Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="form-page">


    <!-- Floating Icons -->

    <div class="floating-icons">

        <span>📚</span>
        <span>🎓</span>
        <span>✏️</span>
        <span>📖</span>
        <span>💡</span>
        <span>🧠</span>

    </div>


    <!-- Login Container -->

    <div class="form-container">

        <div class="form-icon">
            🔐
        </div>


        <h1>
            Welcome Back
        </h1>


        <p class="form-subtitle">
            Login to your win's LearnHub account
        </p>


        <form id="loginForm">


            <!-- Login Type -->

            <div class="input-group">

                <label for="loginType">
                    Login As
                </label>

                <select id="loginType"
                        name="loginType"
                        required>

                    <option value="">
                        -- Select Login Type --
                    </option>

                    <option value="student">
                        🎓 Student Login
                    </option>

                    <option value="staff">
                        👨‍🏫 Staff Login
                    </option>

                </select>

            </div>


            <!-- Email -->

            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <!-- Password -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

            </div>


            <!-- Remember -->

            <div class="form-options">

                <label class="remember">

                    <input
                        type="checkbox"
                        name="remember">

                    Remember me

                </label>


                <a href="#">
                    Forgot Password?
                </a>

            </div>


            <!-- Button -->

            <button
                type="submit"
                class="form-btn">

                🔑 Login

            </button>


        </form>


        <!-- Register Links -->

        <div class="form-bottom">

            <p>
                Don't have a Student account?
            </p>

            <a href="studentRegister.html">
                Register as Student →
            </a>


            <p class="staff-question">
                Are you a Staff member?
            </p>

            <a href="staffRegister.html">
                Register as Staff →
            </a>

        </div>


        <a href="index.html"
           class="back-home">

            ← Back to Home

        </a>

    </div>


    <script src="script.js"></script>

</body>

</html>
